[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerbrain"
version = "1.4.0"
description = "Dockerfile and container monitoring, analysis, and optimization CLI."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["docker", "containers", "monitoring", "optimization", "agents", "llm", "devops", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "docker>=6.0",
    "rich>=13.0",
    "textual>=0.85",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]

[project.scripts]
dockerb = "dockerbrain.cli:cli"

[project.urls]
Homepage = "https://github.com/iamPulakesh/DockerBrain"
Repository = "https://github.com/iamPulakesh/DockerBrain"
Issues = "https://github.com/iamPulakesh/DockerBrain/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dockerbrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
