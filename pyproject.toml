[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerbrain"
version = "1.0.1"
description = "AI-powered Docker container monitoring, analysis, and optimization CLI."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["docker", "containers", "monitoring", "optimization", "gemini", "ai", "devops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.0",
    "docker>=6.0",
    "google-genai>=1.0",
    "openai>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
dockerb = "core.cli:cli"

[project.urls]
Homepage = "https://github.com/iamPulakesh/DockerBrain"
Repository = "https://github.com/iamPulakesh/DockerBrain"
Issues = "https://github.com/iamPulakesh/DockerBrain/issues"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
